[package]
name = "bms-sm"
version = "0.2.0"
edition = "2021"
authors = ["Avii <bms-rs@avii.nl>"]
repository = "https://github.com/aviinl/bms-rs"
description = "Read BMS Shared Memory"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitflags = "2.9"
image = "0.25.8"
windows = { version = "0.62", features = ["Win32_System_Memory", "Win32_Graphics", "Win32_Graphics_DirectDraw", "Win32_System_Threading", "Win32_Foundation", "Win32_System_WindowsProgramming"] }
